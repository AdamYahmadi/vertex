services:
  - type: web
    name: vertex-api
    runtime: python
    plan: standard
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MAX_UPLOAD_MB
        value: "15"

  - type: web
    name: vertex-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://vertex-api.onrender.com/scan
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
